name: Build AuroraTV debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.5 (only used to create the wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Create Gradle wrapper (wrapper jar is not stored in the repo)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p /tmp/wrapgen
            (cd /tmp/wrapgen && echo "" > settings.gradle && gradle wrapper --gradle-version 8.5)
            cp /tmp/wrapgen/gradlew /tmp/wrapgen/gradlew.bat .
            mkdir -p gradle/wrapper
            cp /tmp/wrapgen/gradle/wrapper/* gradle/wrapper/
          fi
          chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AuroraTV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
